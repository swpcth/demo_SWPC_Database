<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แดชบอร์ด — ระบบแอดมิน</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="logo.png" alt="ตราสภาฯ">สภาวิชาชีพฯ<br>ระบบแอดมิน</div>
    <nav>
      <a href="admin-dashboard.html" class="active">แดชบอร์ด</a>
      <a href="admin-members.html">ข้อมูลสมาชิก</a>
      <a href="admin-applications.html">คำขอสมัครสมาชิก</a>
      <a href="admin-licenses.html">ทะเบียน / ใบอนุญาต</a>
      <a href="admin-welfare.html">สวัสดิการสมาชิก</a>
      <a href="admin-payments.html">การชำระเงิน</a>
      <a href="admin-reports.html">รายงาน</a>
      <a href="#" onclick="Auth.clear(); location.href='admin-login.html'; return false;">ออกจากระบบ</a>
    </nav>
    <div class="footer" id="who"></div>
  </aside>

  <main class="main">
    <header>
      <h1>ภาพรวมระบบ</h1>
    </header>

    <div class="stat-grid" id="stats">
      <div class="empty-state">กำลังโหลดข้อมูล...</div>
    </div>

    <div class="panel">
      <h2>สรุปตามประเภทสมาชิก</h2>
      <table id="tbl-type"><tbody></tbody></table>
    </div>

    <div class="panel">
      <h2>สรุปตามสถานะสมาชิก</h2>
      <table id="tbl-status"><tbody></tbody></table>
    </div>
  </main>
</div>

<script src="api.js"></script>
<script>
Auth.requireRole(["admin_super", "admin_staff"], "admin-login.html");
document.getElementById('who').textContent = 'ผู้ใช้งาน: ' + Auth.getUsername();

async function load() {
  try {
    const s = await apiCall('dashboardSummary');
    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="num">${s.totalMembers}</div><div class="label">สมาชิกทั้งหมด</div></div>
      <div class="stat-card"><div class="num">${s.pendingApplications}</div><div class="label">คำขอรอตรวจสอบ</div></div>
      <div class="stat-card"><div class="num">${s.awaitingPayment}</div><div class="label">รอชำระเงิน</div></div>
    `;
    const typeRows = Object.entries(s.byType).map(([k,v]) => `<tr><td>${k || '(ไม่ระบุ)'}</td><td>${v}</td></tr>`).join('');
    document.querySelector('#tbl-type tbody').innerHTML = typeRows || '<tr><td class="empty-state">ยังไม่มีข้อมูล</td></tr>';
    const statusRows = Object.entries(s.byStatus).map(([k,v]) => `<tr><td>${k || '(ไม่ระบุ)'}</td><td>${v}</td></tr>`).join('');
    document.querySelector('#tbl-status tbody').innerHTML = statusRows || '<tr><td class="empty-state">ยังไม่มีข้อมูล</td></tr>';
  } catch (err) {
    document.getElementById('stats').innerHTML = `<div class="empty-state">โหลดข้อมูลไม่สำเร็จ: ${err.message}</div>`;
  }
}
load();
</script>
</body>
</html>
