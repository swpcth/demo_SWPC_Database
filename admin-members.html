<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อมูลสมาชิก — ระบบแอดมิน</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="logo.png" alt="ตราสภาฯ">สภาวิชาชีพฯ<br>ระบบแอดมิน</div>
    <nav>
      <a href="admin-dashboard.html">แดชบอร์ด</a>
      <a href="admin-members.html" class="active">ข้อมูลสมาชิก</a>
      <a href="admin-applications.html">คำขอสมัครสมาชิก</a>
      <a href="admin-licenses.html">ทะเบียน / ใบอนุญาต</a>
      <a href="admin-welfare.html">สวัสดิการสมาชิก</a>
      <a href="admin-payments.html">การชำระเงิน</a>
      <a href="admin-reports.html">รายงาน</a>
      <a href="#" onclick="Auth.clear(); location.href='admin-login.html'; return false;">ออกจากระบบ</a>
    </nav>
    <div class="footer" id="who"></div>
  </aside>

  <main class="main">
    <header>
      <h1>ข้อมูลสมาชิก</h1>
    </header>

    <div class="type-tabs">
      <button class="tab-chip active" data-tab="individual" onclick="switchTab('individual')">สมาชิกบุคคล (สามัญ/สมทบ)</button>
      <button class="tab-chip" data-tab="org" onclick="switchTab('org')">สมาชิกวิสามัญ (องค์กร)</button>
    </div>

    <div class="panel" id="panel-individual">
      <input type="text" id="q" placeholder="ค้นหาจากเลขสมาชิก เลขบัตรประชาชน ชื่อ นามสกุล หรือเลขใบอนุญาต" oninput="search()">
      <table>
        <thead>
          <tr><th>เลขสมาชิก</th><th>ชื่อ-นามสกุล</th><th>ประเภท</th><th>สถานะ</th><th>เลขใบอนุญาต</th><th>จังหวัดที่ปฏิบัติงาน</th></tr>
        </thead>
        <tbody id="rows"><tr><td colspan="6" class="empty-state">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>

    <div class="panel" id="panel-org" style="display:none">
      <input type="text" id="qOrg" placeholder="ค้นหาจากชื่อองค์กร เลขทะเบียน หรือชื่อผู้แทน" oninput="searchOrg()">
      <table>
        <thead>
          <tr><th>เลขทะเบียน</th><th>ชื่อองค์กร</th><th>ประเภทองค์กร</th><th>ผู้แทนองค์กร</th><th>สถานะ</th></tr>
        </thead>
        <tbody id="orgRows"><tr><td colspan="5" class="empty-state">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="api.js"></script>
<script>
Auth.requireRole(["admin_super", "admin_staff"], "admin-login.html");
document.getElementById('who').textContent = 'ผู้ใช้งาน: ' + Auth.getUsername();

let all = [];
let allOrgs = [];

function switchTab(tab) {
  document.querySelectorAll('.tab-chip').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('panel-individual').style.display = tab === 'individual' ? 'block' : 'none';
  document.getElementById('panel-org').style.display = tab === 'org' ? 'block' : 'none';
}

function statusBadge(status) {
  const cls = status === 'ปกติ' ? 'ok' : (status === 'พักใช้' || status === 'เพิกถอน' ? 'warn' : 'pending');
  return `<span class="badge ${cls}">${status || '-'}</span>`;
}

function render(rows) {
  const tbody = document.getElementById('rows');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">ไม่พบข้อมูลสมาชิก</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(m => `
    <tr>
      <td>${m.member_no || '-'}</td>
      <td>${m.prefix_th || ''} ${m.first_name_th || ''} ${m.last_name_th || ''}</td>
      <td>${m.member_type || '-'}</td>
      <td>${statusBadge(m.member_status)}</td>
      <td>${m.license_no || '-'}</td>
      <td>${m.work_province || '-'}</td>
    </tr>
  `).join('');
}

function renderOrg(rows) {
  const tbody = document.getElementById('orgRows');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">ไม่พบข้อมูลสมาชิกวิสามัญ</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(o => `
    <tr>
      <td>${o.reg_no || '-'}</td>
      <td>${o.org_name_th || '-'}</td>
      <td>${o.org_type || '-'}</td>
      <td>${o.rep_name || '-'}</td>
      <td>${statusBadge(o.status)}</td>
    </tr>
  `).join('');
}

function search() {
  const q = document.getElementById('q').value.toLowerCase();
  render(all.filter(m =>
    !q ||
    String(m.national_id||'').includes(q) ||
    String(m.member_no||'').toLowerCase().includes(q) ||
    String(m.first_name_th||'').toLowerCase().includes(q) ||
    String(m.last_name_th||'').toLowerCase().includes(q) ||
    String(m.license_no||'').includes(q)
  ));
}

function searchOrg() {
  const q = document.getElementById('qOrg').value.toLowerCase();
  renderOrg(allOrgs.filter(o =>
    !q ||
    String(o.org_name_th||'').toLowerCase().includes(q) ||
    String(o.reg_no||'').toLowerCase().includes(q) ||
    String(o.rep_name||'').toLowerCase().includes(q)
  ));
}

async function load() {
  try {
    all = await apiCall('listMembers');
    render(all);
  } catch (err) {
    document.getElementById('rows').innerHTML = `<tr><td colspan="6" class="empty-state">โหลดข้อมูลไม่สำเร็จ: ${err.message}</td></tr>`;
  }
  try {
    allOrgs = await apiCall('listMembersOrg');
    renderOrg(allOrgs);
  } catch (err) {
    document.getElementById('orgRows').innerHTML = `<tr><td colspan="5" class="empty-state">โหลดข้อมูลไม่สำเร็จ: ${err.message}</td></tr>`;
  }
}
load();
</script>
</body>
</html>
