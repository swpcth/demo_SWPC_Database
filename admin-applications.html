<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คำขอสมัครสมาชิก — ระบบแอดมิน</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="logo.png" alt="ตราสภาฯ">สภาวิชาชีพฯ<br>ระบบแอดมิน</div>
    <nav>
      <a href="admin-dashboard.html">แดชบอร์ด</a>
      <a href="admin-members.html">ข้อมูลสมาชิก</a>
      <a href="admin-applications.html" class="active">คำขอสมัครสมาชิก</a>
      <a href="admin-licenses.html">ทะเบียน / ใบอนุญาต</a>
      <a href="admin-welfare.html">สวัสดิการสมาชิก</a>
      <a href="admin-payments.html">การชำระเงิน</a>
      <a href="admin-reports.html">รายงาน</a>
      <a href="#" onclick="Auth.clear(); location.href='index.html'; return false;">ออกจากระบบ</a>
    </nav>
    <div class="footer" id="who"></div>
  </aside>

  <main class="main">
    <header><h1>คำขอสมัครสมาชิก</h1></header>

    <div class="panel">
      <h2>รอตรวจสอบ / รออนุมัติ</h2>
      <table>
        <thead><tr><th>เลขที่คำขอ</th><th>ประเภท</th><th>วันที่ยื่น</th><th>สถานะ</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="empty-state">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="api.js"></script>
<script>
Auth.requireRole(["admin_super", "admin_staff"], "index.html");
document.getElementById('who').textContent = 'ผู้ใช้งาน: ' + Auth.getUsername();

async function load() {
  try {
    const rows = (await apiCall('listApplications')).filter(a => a.status === 'รอตรวจสอบ' || a.status === 'รออนุมัติ');
    const tbody = document.getElementById('rows');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-state">ไม่มีคำขอค้างดำเนินการ</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(a => `
      <tr>
        <td>${a.application_id}</td>
        <td>${a.applicant_type}</td>
        <td>${new Date(a.submitted_at).toLocaleDateString('th-TH')}</td>
        <td><span class="badge pending">${a.status}</span></td>
        <td>
          <button class="btn small" onclick="review('${a.application_id}','approve')">อนุมัติ</button>
          <button class="btn small secondary" onclick="review('${a.application_id}','reject')">ไม่อนุมัติ</button>
        </td>
      </tr>
    `).join('');
  } catch (err) {
    document.getElementById('rows').innerHTML = `<tr><td colspan="5" class="empty-state">โหลดข้อมูลไม่สำเร็จ: ${err.message}</td></tr>`;
  }
}

async function review(applicationId, decision) {
  let reason = '';
  if (decision === 'reject') {
    reason = prompt('ระบุเหตุผลที่ไม่อนุมัติ:') || '';
    if (!reason) return;
  }
  try {
    await apiCall('reviewApplication', { application_id: applicationId, decision, reason });
    load();
  } catch (err) {
    alert('ดำเนินการไม่สำเร็จ: ' + err.message);
  }
}

load();
</script>
</body>
</html>
