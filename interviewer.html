<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ระบบให้คะแนนสอบสัมภาษณ์ — สำหรับกรรมการ</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
<style>
  body { background: var(--paper); }
  .iv-wrap { max-width: 880px; margin: 0 auto; padding: 16px 16px 60px; }
  .iv-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--navy-deep); }
  .iv-login-card { background: #fff; border-radius: 8px; padding: 32px 28px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .iv-login-card img { width: 84px; height: auto; margin-bottom: 12px; }
  .iv-login-card h1 { font-family: var(--font-display); font-size: 21px; margin: 0 0 4px; color: var(--navy-deep); }
  .iv-login-card p { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .iv-code-input { width: 100%; text-align: center; font-size: 26px; letter-spacing: .3em; text-transform: uppercase; padding: 12px; border: 2px solid var(--line); border-radius: 6px; font-family: monospace; margin-bottom: 14px; }
  .iv-code-input:focus { outline: none; border-color: var(--navy); }
  .iv-note { font-size: 12px; color: var(--muted); margin-top: 14px; }
  .iv-top { background: var(--navy-deep); color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 20; }
  .iv-top-inner { max-width: 880px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .iv-top img { height: 36px; width: auto; background: #fff; border-radius: 4px; padding: 2px; }
  .iv-top .who { flex: 1; min-width: 0; line-height: 1.35; }
  .iv-top .who b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iv-top .who span { font-size: 12px; opacity: .8; }
  .iv-top button { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 4px; padding: 7px 11px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .iv-top button:hover { background: rgba(255,255,255,.26); }
  .iv-info { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .iv-chip { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 3px 12px; font-size: 13px; color: var(--ink); }
  .iv-chip.dark { background: var(--navy-deep); color: #fff; border-color: var(--navy-deep); }
  .iv-banner { background: #fbeee7; border: 1px solid #e8c3b4; color: var(--warn); border-radius: 6px; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
  .iv-progress { height: 8px; background: #e7e3d6; border-radius: 4px; overflow: hidden; margin: 6px 0 4px; }
  .iv-progress > div { height: 100%; background: var(--ok); transition: width .3s; }
  .iv-cand { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .iv-cand.absent { background: #fbf3ef; }
  .iv-cand .time { font-family: monospace; font-size: 15px; color: var(--navy); min-width: 56px; }
  .iv-cand .info { flex: 1; min-width: 160px; }
  .iv-cand .info .no { font-size: 12px; color: var(--muted); }
  .iv-cand .info .nm { font-size: 16px; font-weight: 600; }
  .iv-cand.absent .nm { text-decoration: line-through; color: var(--muted); }
  .iv-cand .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .iv-btn { border: 1px solid var(--navy); background: var(--navy); color: #fff; border-radius: 6px; padding: 9px 16px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .iv-btn.light { background: #fff; color: var(--navy-deep); border-color: var(--line); }
  .iv-btn.danger { background: #fff; color: var(--warn); border-color: #e8c3b4; }
  .iv-btn:disabled { opacity: .5; cursor: not-allowed; }
  .iv-crit { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 18px; margin-bottom: 14px; }
  .iv-crit h3 { margin: 0 0 4px; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; }
  .iv-crit h3 .max { font-size: 13px; color: var(--navy); background: #e6eef6; padding: 2px 10px; border-radius: 6px; white-space: nowrap; }
  .iv-crit p.hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  .iv-levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .iv-level { border: 2px solid var(--line); border-radius: 8px; padding: 10px 6px; text-align: center; cursor: pointer; background: #fff; font-family: inherit; }
  .iv-level b { display: block; font-size: 15px; }
  .iv-level span { font-size: 12px; color: var(--muted); }
  .iv-level.sel-excellent { border-color: #2f6b4f; background: #e5efe8; }
  .iv-level.sel-good { border-color: #c79a2b; background: #f7efd9; }
  .iv-level.sel-fair { border-color: #c23b2e; background: #fbeee7; }
  .iv-scorebox { display: flex; align-items: center; gap: 12px; background: #f5f4ef; border-radius: 6px; padding: 10px 12px; }
  .iv-scorebox label { font-size: 14px; font-weight: 600; margin: 0; width: auto; }
  .iv-scorebox input { width: 110px; font-size: 22px; text-align: center; padding: 8px; border: 1px solid var(--line); border-radius: 6px; font-weight: 700; }
  .iv-total { background: var(--navy-deep); color: #fff; border-radius: 8px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; margin: 14px 0; }
  .iv-total b { font-size: 30px; }
  .iv-total span { font-size: 14px; opacity: .8; }
  textarea.iv-remark { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 10px; font-family: inherit; font-size: 14px; min-height: 80px; }
  @media (max-width: 560px) { .iv-cand .actions { width: 100%; } .iv-cand .actions .iv-btn { flex: 1; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="api.js"></script>
<script>
// หน้านี้ใช้โดยกรรมการสอบสัมภาษณ์ — ไม่มีบัญชีผู้ใช้ ไม่เข้าระบบเจ้าหน้าที่ ใช้ "รหัสเข้าใช้" ที่เจ้าหน้าที่ออกให้เท่านั้น
const TOKEN_KEY = 'swc_iv_token';
const $app = document.getElementById('app');
let state = { token: null, ctx: null, criteria: [], candidates: [], passScore: 60, view: 'login', editing: null, refreshing: false };

function getTok() { try { return sessionStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
function setTok(t) { try { if (t) sessionStorage.setItem(TOKEN_KEY, t); else sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }

async function ivCall(action, payload) {
  const res = await fetch(API_BASE_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action, token: state.token }, payload || {}))
  });
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); } catch (e) { throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง'); }
  if (!json.ok) {
    if (/หมดอายุ/.test(String(json.error)) && state.token) { setTok(null); state.token = null; state.view = 'login'; render(); }
    throw new Error(json.error || 'เกิดข้อผิดพลาด');
  }
  return json.data;
}

const LEVELS = {
  30: { excellent: { min: 21, max: 30, label: 'ดีมาก', hint: '> 4 ด้าน' }, good: { min: 11, max: 20, label: 'ดี', hint: '3-4 ด้าน' }, fair: { min: 0, max: 10, label: 'พอใช้', hint: '1-2 ด้าน' } },
  20: { excellent: { min: 16, max: 20, label: 'ดีมาก', hint: '' }, good: { min: 11, max: 15, label: 'ดี', hint: '' }, fair: { min: 0, max: 10, label: 'พอใช้', hint: '' } }
};
function levelOf(max, v) {
  if (v === '' || v === null || v === undefined) return '';
  const n = Number(v), L = LEVELS[max];
  return Object.keys(L).find(k => n >= L[k].min && n <= L[k].max) || '';
}
const esc = s => escapeHtml(String(s === undefined || s === null ? '' : s));
function fmtDate(iso) { if (!iso) return '-'; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' }); }

// ---------- หน้าเข้าสู่ระบบ ----------
function renderLogin() {
  $app.innerHTML = `
  <div class="iv-login"><div class="iv-login-card">
    <img src="logo.png" alt="ตราสภาฯ">
    <h1>ระบบให้คะแนนสอบสัมภาษณ์</h1>
    <p>สภาวิชาชีพสังคมสงเคราะห์ · สำหรับกรรมการสอบ</p>
    <form id="loginForm">
      <input class="iv-code-input" id="code" maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="รหัสเข้าใช้" required>
      <button class="btn" id="loginBtn" type="submit">เข้าสู่ระบบ</button>
    </form>
    <div class="iv-note">กรอก "รหัสเข้าใช้" 6 ตัวอักษรที่เจ้าหน้าที่แจ้งให้ท่าน (แต่ละท่านมีรหัสของตนเอง) ไม่ต้องสมัครสมาชิกหรือใช้บัญชีเจ้าหน้าที่</div>
  </div></div>`;
  const input = document.getElementById('code');
  const m = (location.hash || '').match(/code=([A-Za-z0-9]+)/);
  if (m) { input.value = m[1].toUpperCase(); history.replaceState(null, '', location.pathname + location.search); }
  input.focus();
  document.getElementById('loginForm').onsubmit = async e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
    try {
      const res = await ivCall('interviewerLogin', { code: input.value });
      state.token = res.token; setTok(res.token);
      state.ctx = res; state.criteria = res.criteria;
      await loadData(false);
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
    }
  };
}

// ---------- รายชื่อผู้เข้าสอบ ----------
async function loadData(silent) {
  if (state.refreshing) return;
  state.refreshing = true;
  try {
    const d = await ivCall('interviewerGetData', {});
    state.ctx = d; state.criteria = d.criteria; state.candidates = d.candidates; state.passScore = d.pass_score;
    if (!silent || state.view !== 'form') state.view = state.view === 'form' ? 'form' : 'list';
    render();
  } catch (err) {
    if (!silent) showToast(err.message, 'error');
  } finally { state.refreshing = false; }
}

function topBar() {
  const c = state.ctx;
  return `<div class="iv-top"><div class="iv-top-inner">
    <img src="logo.png" alt="">
    <div class="who"><b>${esc(c.name)}</b><span>${c.slot === 'inv1' ? 'กรรมการท่านที่ 1' : 'กรรมการท่านที่ 2'} · กลุ่มที่ ${esc(c.group_no)}</span></div>
    <button onclick="loadData(false)" title="รีเฟรช">↻ รีเฟรช</button>
    <button onclick="logout()">ออก</button>
  </div></div>`;
}

function renderList() {
  const c = state.ctx;
  const cands = state.candidates;
  const active = cands.filter(x => !x.absent);
  const done = active.filter(x => x.my_score).length;
  const pct = active.length ? Math.round(done * 100 / active.length) : 0;
  $app.innerHTML = topBar() + `<div class="iv-wrap">
    <div class="iv-info">
      <span class="iv-chip dark">รอบสอบสัมภาษณ์ ${esc(c.round_label)}</span>
      <span class="iv-chip">วันที่ ${esc(fmtDate(c.exam_date))}</span>
      ${c.group_time_range || c.time_text ? `<span class="iv-chip">เวลา ${esc(c.group_time_range || c.time_text)}</span>` : ''}
      ${c.location_note ? `<span class="iv-chip">${esc(c.location_note)}</span>` : ''}
      ${c.partner_name ? `<span class="iv-chip">กรรมการร่วมกลุ่ม: ${esc(c.partner_name)}</span>` : ''}
    </div>
    ${c.scoring_closed ? '<div class="iv-banner"><b>ปิดรับคะแนนแล้ว</b> — เจ้าหน้าที่ปิดการบันทึกคะแนนของรอบนี้ ท่านดูคะแนนที่บันทึกไว้ได้ แต่แก้ไขไม่ได้</div>' : ''}
    <div style="font-size:14px; color:var(--muted)">ให้คะแนนแล้ว <b style="color:var(--ink)">${done}</b> จาก <b style="color:var(--ink)">${active.length}</b> คน${cands.length - active.length ? ` (ไม่เข้าสอบ ${cands.length - active.length} คน)` : ''}</div>
    <div class="iv-progress"><div style="width:${pct}%"></div></div>
    <div style="font-size:12px; color:var(--muted); margin-bottom:14px">คะแนนที่ท่านบันทึกเห็นได้เฉพาะท่านและเจ้าหน้าที่ — กรรมการอีกท่านไม่เห็นคะแนนของท่าน · ผ่านเมื่อคะแนนเฉลี่ยของกรรมการ 2 ท่านไม่น้อยกว่า ${esc(state.passScore)} จาก 100</div>
    ${cands.length ? cands.map(candCard).join('') : '<div class="empty-state">ยังไม่มีผู้เข้าสอบในกลุ่มนี้ — กรุณาติดต่อเจ้าหน้าที่</div>'}
  </div>`;
}

function candCard(x) {
  const closed = state.ctx.scoring_closed;
  let status;
  if (x.absent) status = '<span class="badge warn">ไม่เข้าสอบ</span>';
  else if (x.my_score) status = `<span class="badge ok">ให้คะแนนแล้ว ${esc(x.my_score.total)}/100</span>`;
  else status = '<span class="badge pending">รอให้คะแนน</span>';
  let actions = '';
  if (x.absent) actions = closed ? '' : `<button class="iv-btn light" onclick="toggleAbsent('${esc(x.application_id)}', false)">ยกเลิกสถานะไม่เข้าสอบ</button>`;
  else actions = `<button class="iv-btn ${x.my_score ? 'light' : ''}" onclick="openForm('${esc(x.application_id)}')">${closed ? 'ดูคะแนน' : (x.my_score ? 'ดู/แก้ไขคะแนน' : 'ให้คะแนน')}</button>` +
    (closed || x.my_score ? '' : `<button class="iv-btn danger" onclick="toggleAbsent('${esc(x.application_id)}', true)">ไม่เข้าสอบ</button>`);
  return `<div class="iv-cand ${x.absent ? 'absent' : ''}">
    <div class="time">${esc(x.time_slot || '-')}</div>
    <div class="info"><div class="no">รหัสสอบ ${esc(x.candidate_no || '-')}</div><div class="nm">${esc(x.name)}</div><div style="margin-top:4px">${status}</div></div>
    <div class="actions">${actions}</div>
  </div>`;
}

async function toggleAbsent(appId, absent) {
  const x = state.candidates.find(c => c.application_id === appId);
  const ok = await showConfirm(absent
    ? 'ระบุว่า "' + x.name + '" ไม่เข้าสอบ?\nผู้เข้าสอบจะไม่ถูกนับผ่าน/ไม่ผ่าน และให้คะแนนไม่ได้จนกว่าจะยกเลิกสถานะนี้'
    : 'ยกเลิกสถานะ "ไม่เข้าสอบ" ของ "' + x.name + '" ?', 'ยืนยัน');
  if (!ok) return;
  try {
    await ivCall('interviewerSetAbsent', { application_id: appId, absent: absent });
    showToast(absent ? 'บันทึกว่าไม่เข้าสอบแล้ว' : 'ยกเลิกสถานะแล้ว', 'success');
    await loadData(true);
  } catch (err) { showToast(err.message, 'error'); }
}

// ---------- ฟอร์มให้คะแนน ----------
function openForm(appId) {
  const x = state.candidates.find(c => c.application_id === appId);
  const s = x.my_score || {};
  state.editing = { appId: appId, cand: x, scores: {}, remark: x.my_remark || '' };
  state.criteria.forEach(c => { state.editing.scores[c.key] = s[c.key] === undefined ? '' : s[c.key]; });
  state.view = 'form';
  renderForm();
  window.scrollTo(0, 0);
}

function renderForm() {
  const ed = state.editing, closed = state.ctx.scoring_closed;
  const total = state.criteria.reduce((sum, c) => sum + (Number(ed.scores[c.key]) || 0), 0);
  $app.innerHTML = topBar() + `<div class="iv-wrap">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap">
      <div><div style="font-size:12px; color:var(--muted)">ผู้เข้าสอบ · รหัสสอบ ${esc(ed.cand.candidate_no)}</div><div style="font-size:20px; font-weight:700">${esc(ed.cand.name)}</div></div>
      <button class="iv-btn light" onclick="backToList()">← กลับหน้ารายชื่อ</button>
    </div>
    ${closed ? '<div class="iv-banner">ปิดรับคะแนนแล้ว — ดูได้อย่างเดียว</div>' : ''}
    ${state.criteria.map((c, i) => critBlock(c, i)).join('')}
    <div class="iv-crit">
      <h3>ข้อเสนอแนะเพิ่มเติม</h3>
      <textarea class="iv-remark" id="remark" maxlength="1000" placeholder="พิมพ์ข้อสังเกต (ถ้ามี)" ${closed ? 'disabled' : ''}>${esc(ed.remark)}</textarea>
    </div>
    <div class="iv-total"><span>รวมคะแนนทั้งหมด</span><div><b id="totalNum">${total}</b> <span>/ 100</span></div></div>
    ${closed ? '' : '<button class="btn" id="saveBtn" onclick="saveScore()" style="width:100%; padding:14px; font-size:16px">บันทึกคะแนน</button>'}
  </div>`;
  document.getElementById('remark').oninput = e => { ed.remark = e.target.value; };
}

function critBlock(c, i) {
  const ed = state.editing, closed = state.ctx.scoring_closed;
  const v = ed.scores[c.key];
  const lvl = ed.levels && ed.levels[c.key] !== undefined ? ed.levels[c.key] : levelOf(c.max, v);
  const L = LEVELS[c.max];
  return `<div class="iv-crit">
    <h3><span>${i + 1}. ${esc(c.label)}</span><span class="max">เต็ม ${c.max}</span></h3>
    <p class="hint">${esc(c.hint)}</p>
    <div class="iv-levels">${Object.keys(L).map(k => `
      <button type="button" class="iv-level ${lvl === k ? 'sel-' + k : ''}" ${closed ? 'disabled' : ''} onclick="pickLevel('${c.key}', '${k}')">
        <b>${L[k].label}</b>${L[k].hint ? `<span>${L[k].hint}</span><br>` : ''}<span>${L[k].min}-${L[k].max} คะแนน</span>
      </button>`).join('')}</div>
    ${lvl ? `<div class="iv-scorebox"><label for="sc_${c.key}">ระบุคะแนน (${L[lvl].min}-${L[lvl].max}):</label>
      <input id="sc_${c.key}" type="number" inputmode="numeric" min="${L[lvl].min}" max="${L[lvl].max}" step="1" value="${v === '' ? '' : esc(v)}" ${closed ? 'disabled' : ''} oninput="setScore('${c.key}', this.value)"></div>` : '<div style="font-size:13px; color:var(--muted)">เลือกระดับคะแนนก่อน แล้วระบุคะแนนในช่วงนั้น</div>'}
  </div>`;
}

function pickLevel(key, lvl) {
  const ed = state.editing;
  ed.levels = ed.levels || {};
  if (levelOf(state.criteria.find(c => c.key === key).max, ed.scores[key]) !== lvl) ed.scores[key] = '';
  ed.levels[key] = lvl;
  const remark = document.getElementById('remark'); if (remark) ed.remark = remark.value;
  renderForm();
  const inp = document.getElementById('sc_' + key); if (inp) inp.focus();
}

function setScore(key, val) {
  state.editing.scores[key] = val === '' ? '' : Number(val);
  const total = state.criteria.reduce((sum, c) => sum + (Number(state.editing.scores[c.key]) || 0), 0);
  document.getElementById('totalNum').textContent = total;
}

function validateForm() {
  const ed = state.editing;
  for (const c of state.criteria) {
    const v = ed.scores[c.key];
    const lvl = ed.levels && ed.levels[c.key] !== undefined ? ed.levels[c.key] : levelOf(c.max, v);
    if (v === '' || v === undefined || !lvl) return 'กรุณาเลือกระดับและระบุคะแนนหัวข้อ "' + c.label + '"';
    const L = LEVELS[c.max][lvl];
    if (!Number.isInteger(Number(v)) || v < L.min || v > L.max) return 'คะแนนหัวข้อ "' + c.label + '" ต้องเป็นจำนวนเต็มในช่วง ' + L.min + '-' + L.max + ' (ระดับ' + L.label + ')';
  }
  return '';
}

async function saveScore() {
  const err = validateForm();
  if (err) { showToast(err, 'error'); return; }
  const ed = state.editing;
  const total = state.criteria.reduce((sum, c) => sum + Number(ed.scores[c.key]), 0);
  if (!(await showConfirm('ยืนยันบันทึกคะแนนของ "' + ed.cand.name + '"\nรวม ' + total + ' / 100 คะแนน', 'บันทึกคะแนน'))) return;
  const btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try {
    await ivCall('interviewerSaveScore', { application_id: ed.appId, scores: ed.scores, remark: ed.remark });
    showToast('บันทึกคะแนนเรียบร้อยแล้ว', 'success');
    state.editing = null; state.view = 'list';
    await loadData(true);
    window.scrollTo(0, 0);
  } catch (e) {
    showToast(e.message, 'error');
    if (document.getElementById('saveBtn')) { btn.disabled = false; btn.textContent = 'บันทึกคะแนน'; }
  }
}

function backToList() { state.editing = null; state.view = 'list'; render(); }

function logout() { setTok(null); state.token = null; state.view = 'login'; state.ctx = null; render(); }

function render() {
  if (state.view === 'login' || !state.token || !state.ctx) return renderLogin();
  if (state.view === 'form' && state.editing) return renderForm();
  renderList();
}

// รีเฟรชรายชื่อเงียบๆ ทุก 90 วินาที (ขณะอยู่หน้ารายชื่อ) เพื่อให้เห็นการเปลี่ยนแปลงล่าสุดจากเจ้าหน้าที่
setInterval(() => { if (state.token && state.view === 'list') loadData(true); }, 90000);

// เริ่มต้น: ถ้ามี token เดิมในเซสชันเบราว์เซอร์ ให้เข้าต่อได้เลย
(async function init() {
  const t = getTok();
  if (t) {
    state.token = t;
    try { await loadData(true); if (state.ctx) return; } catch (e) {}
    state.token = null; setTok(null);
  }
  state.view = 'login'; render();
})();
</script>
